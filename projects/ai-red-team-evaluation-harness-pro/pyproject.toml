[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-red-team-evaluation-harness-pro"
version = "1.0.0"
description = "Professional AI red-team and evaluation harness for RAG and agentic applications"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6,<7",
  "rich>=14,<15"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6,<7", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
